apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  namespace: exercises
  name: cpu-usage
spec:
  metrics:
    - name: cpu-usage
      initialDelay: 1m
      interval: 1m
      count: 5
      successCondition: result[0] < 0.05
      failureLimit: 0
      provider:
        prometheus:
          address: http://prom-prometheus-server.prometheus.svc.cluster.local:80
          query: |
            sum(rate(container_cpu_usage_seconds_total{namespace="exercises"}[5m]))
