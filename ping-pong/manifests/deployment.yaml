apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ping-pong:1.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ping-pong-configmap
            - secretRef:
                name: postgres-secret
