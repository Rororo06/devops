apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: project

resources:
  - manifests/configmap.yaml
  - manifests/secret.yaml
  - manifests/persistentvolumeclaim.yaml
  - manifests/statefulset.yaml
  - manifests/cronjob.yaml
  - manifests/backup-cronjob.yaml
  - todo-app/manifests/deployment.yaml
  - todo-app/manifests/service.yaml
  - todo-app/manifests/ingress.yaml
  - todo-backend/manifests/deployment.yaml
  - todo-backend/manifests/service.yaml
  - broadcaster/manifests/deployment.yaml

images:
  - name: PROJECT/TODO_APP
    newName: todo-app
    newTag: "1.7"
  - name: PROJECT/TODO_BACKEND
    newName: todo-backend
    newTag: "1.6"
  - name: PROJECT/BROADCASTER
    newName: broadcaster
    newTag: "1.0"
