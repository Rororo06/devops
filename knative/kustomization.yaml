apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: exercises

resources:
  - ../ping-pong/manifests/configmap.yaml
  - ../ping-pong/manifests/secret.yaml
  - ../ping-pong/manifests/statefulset.yaml
  - manifests/ping-pong.yaml
  - ../log_output/manifests/configmap.yaml
  - ../log_output/manifests/service.yaml
  - ../log_output/manifests/deployment.yaml

patches:
  - path: patches/log-output-ping-pong-url.yaml
    target:
      kind: Deployment
      name: log-output-dep

images:
  - name: PROJECT/PING_PONG
    newName: dev.local/ping-pong
    newTag: "1.6"
  - name: PROJECT/LOG_OUTPUT_WRITER
    newName: log-output-writer
    newTag: "1.1"
  - name: PROJECT/LOG_OUTPUT_READER
    newName: log-output-reader
    newTag: "1.5"
