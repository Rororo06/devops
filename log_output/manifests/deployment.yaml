apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-log
          emptyDir: {}
        - name: config
          configMap:
            name: log-output-configmap
            items:
              - key: information.txt
                path: information.txt
      containers:
        - name: log-output-writer
          image: log-output-writer:1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_DIR
              value: /usr/src/app/files
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
        - name: log-output-reader
          image: log-output-reader:1.4
          imagePullPolicy: IfNotPresent
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            httpGet:
              path: /healthz
              port: 3000
          env:
            - name: PORT
              value: "3000"
            - name: PING_PONG_URL
              value: http://ping-pong-svc:2346
            - name: LOG_DIR
              value: /usr/src/app/files
            - name: INFORMATION_FILE
              value: /usr/src/app/config/information.txt
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-configmap
                  key: MESSAGE
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
            - name: config
              mountPath: /usr/src/app/config
