apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: project-staging

resources:
  - namespace.yaml
  - ./../../base

patches:
  - path: ingress.yaml

images:
  - name: PROJECT/TODO_APP
    newName: todo-app
    newTag: "1.7"
  - name: PROJECT/TODO_BACKEND
    newName: todo-backend
    newTag: "1.6"
  - name: PROJECT/BROADCASTER
    newName: broadcaster
    newTag: "1.0"
