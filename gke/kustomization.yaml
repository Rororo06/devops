apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: exercises

resources:
  - ../ping-pong/manifests/configmap.yaml
  - ../ping-pong/manifests/secret.yaml
  - ../ping-pong/manifests/statefulset.yaml
  - ../ping-pong/manifests/rollout.yaml
  - ../ping-pong/manifests/analysistemplate.yaml
  - ../log_output/manifests/configmap.yaml
  - ../log_output/manifests/deployment.yaml
  - services-nodeport.yaml
  - ingress.yaml

images:
  - name: ping-pong
    newName: europe-north1-docker.pkg.dev/speedy-atom-500823-f0/my-repository/ping-pong
    newTag: v1
  - name: log-output-writer
    newName: europe-north1-docker.pkg.dev/speedy-atom-500823-f0/my-repository/log-output-writer
    newTag: v1
  - name: log-output-reader
    newName: europe-north1-docker.pkg.dev/speedy-atom-500823-f0/my-repository/log-output-reader
    newTag: v1
